name: iOS

on:
  push:
    paths:
      - 'OnomatopoeiaDetector/**'
      - 'OnomatopoeiaDetectorTests/**'
      - 'OnomatopoeiaDetector.xcodeproj/**'
      - 'shared/onomatopoeia_dict.json'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'OnomatopoeiaDetector/**'
      - 'OnomatopoeiaDetectorTests/**'
      - 'OnomatopoeiaDetector.xcodeproj/**'
      - 'shared/onomatopoeia_dict.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone

      - name: Unit tests
        run: |
          xcodebuild test \
            -project OnomatopoeiaDetector.xcodeproj \
            -scheme OnomatopoeiaDetector \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
